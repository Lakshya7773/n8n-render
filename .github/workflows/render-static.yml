name: Render YouTube Video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render job ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Input smoke test
        run: echo "JOB_ID=\${{ inputs.job_id }}"
