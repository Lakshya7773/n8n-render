name: Render YouTube Video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render job ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load render job
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          tar -xzf n8n-render-cloud-worker.tar.gz
          cp "jobs/${JOB_ID}.json" n8n-render-cloud/render-job.json
      - name: Smoke test loaded job
        run: |
          test -s n8n-render-cloud/render-job.json
          cat n8n-render-cloud/render-job.json
