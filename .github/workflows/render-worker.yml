name: Render YouTube Video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render job ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load render job
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          tar -xzf n8n-render-cloud-worker.tar.gz
          cp "jobs/${JOB_ID}.json" n8n-render-cloud/render-job.json
      - name: Write browser-safe Remotion composition
        run: |
          cat > n8n-render-cloud/src/composition.tsx <<'EOF'
          import React from 'react';
          import {Composition, registerRoot} from 'remotion';
          export type Scene = { text?: string; title?: string; body?: string; duration?: number; image?: string; };
          export type RenderJob = { type?: 'long_form' | 'short'; aspect_ratio?: '16:9' | '9:16'; duration?: number; title?: string; script?: string; scenes?: Scene[]; visuals?: Scene[]; captions?: string[]; output_name?: string; };
          const fps=30; const clamp=(n:number,min:number,max:number)=>Math.max(min,Math.min(max,n));
          function Video({job}:{job:RenderJob}) { return <div style={{width:'100%',height:'100%',background:'#080808',color:'white'}}>{job.title||'Untitled'}</div>; }
          function Root({job}:{job:RenderJob}) { const width=job.aspect_ratio==='9:16'?1080:1920; const height=job.aspect_ratio==='9:16'?1920:1080; const duration=clamp(Number(job.duration||(job.type==='short'?45:300)),job.type==='short'?20:30,900); return <Composition id="YTVideo" component={Video} durationInFrames={Math.round(duration*fps)} fps={fps} width={width} height={height} defaultProps={{job}}/>; }
          registerRoot(Root);
          EOF
      - name: Smoke test composition source
        run: test -s n8n-render-cloud/src/composition.tsx
