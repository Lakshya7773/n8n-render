name: Render YouTube Video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render job ID
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load render job
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          tar -xzf n8n-render-cloud-worker.tar.gz
          cp "jobs/${JOB_ID}.json" n8n-render-cloud/render-job.json
      - name: Write browser-safe Remotion composition
        run: |
          cat > n8n-render-cloud/src/composition.tsx <<'EOF'
          import React from 'react';
          import {Composition, registerRoot} from 'remotion';
          export type Scene = { text?: string; title?: string; body?: string; duration?: number; image?: string; };
          export type RenderJob = { type?: 'long_form' | 'short'; aspect_ratio?: '16:9' | '9:16'; duration?: number; title?: string; script?: string; scenes?: Scene[]; visuals?: Scene[]; captions?: string[]; output_name?: string; };
          function Video({job}:{job:RenderJob}) {
            const scenes=(job?.scenes?.length?job.scenes:job?.visuals?.length?job.visuals:[{text:job?.script||job?.title||''}]);
            return <div style={{width:'100%',height:'100%',background:'#080808',color:'white',fontFamily:'Arial,sans-serif',display:'flex',alignItems:'center',justifyContent:'center',padding:80,boxSizing:'border-box'}}><div style={{width:'88%',textAlign:'center'}}><div style={{fontSize:58,fontWeight:800,lineHeight:1.08}}>{job?.title||'Untitled'}</div><div style={{marginTop:40,fontSize:38,lineHeight:1.25,opacity:.92}}>{scenes[0]?.title||scenes[0]?.text||job?.script||''}</div></div></div>;
          }
          function Root() {
            return <><Composition id="YTVideo" component={Video} durationInFrames={27000} fps={30} width={1920} height={1080} defaultProps={{job:{}}}/><Composition id="YTVideoShort" component={Video} durationInFrames={1800} fps={30} width={1080} height={1920} defaultProps={{job:{}}}/></>;
          }
          registerRoot(Root);
          EOF
      - name: Write Node render runner
        run: |
          cat > n8n-render-cloud/src/render.ts <<'EOF'
          import {renderMedia,selectComposition} from '@remotion/renderer';
          import {bundle} from '@remotion/bundler';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import type {RenderJob} from './composition';
          const jobPath=process.env.RENDER_JOB||'render-job.json';
          async function main(){
            const job:RenderJob=JSON.parse(await fs.readFile(jobPath,'utf8'));
            const outDir=path.resolve('output');
            await fs.mkdir(outDir,{recursive:true});
            const output=path.join(outDir,job.output_name||'render-test.mp4');
            const serveUrl=await bundle({entryPoint:path.resolve('src/composition.tsx'),webpackOverride:(c:any)=>c});
            const id=job.aspect_ratio==='9:16'?'YTVideoShort':'YTVideo';
            const comp=await selectComposition({serveUrl,id,inputProps:{job}});
            await renderMedia({codec:'h264',serveUrl,composition:comp,inputProps:{job},outputLocation:output,overwrite:true});
            await fs.writeFile(path.join(outDir,'result.json'),JSON.stringify({status:'rendered',video_file:output,aspect_ratio:job.aspect_ratio||'16:9',duration:comp.durationInFrames/30},null,2));
          }
          main().catch(err=>{console.error(err);process.exit(1);});
          EOF
      - name: Install worker dependencies
        run: cd n8n-render-cloud && npm install
      - name: Ensure Remotion browser
        run: cd n8n-render-cloud && npx remotion browser ensure
      - name: Render
        id: render
        continue-on-error: true
        run: |
          set -o pipefail
          cd n8n-render-cloud
          npx tsx src/render.ts 2>&1 | tee render.log
      - name: Upload render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-output-${{ github.run_id }}
          path: |
            n8n-render-cloud/render.log
            n8n-render-cloud/output/
          if-no-files-found: warn
          retention-days: 1
      - name: Publish temporary render log
        if: steps.render.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diagnostics
          cp n8n-render-cloud/render.log "diagnostics/render-${{ github.run_id }}.log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "diagnostics/render-${{ github.run_id }}.log"
          git commit -m "TEMP render diagnostic log ${{ github.run_id }}" || true
          git push
      - name: Fail if render failed
        if: steps.render.outcome != 'success'
        run: exit 1
