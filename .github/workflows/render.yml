name: Render YouTube Video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Render job ID; file must exist at jobs/<job_id>.json'
        required: true
        type: string
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load render job
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          tar -xzf n8n-render-cloud-worker.tar.gz
          cp "jobs/${JOB_ID}.json" n8n-render-cloud/render-job.json
      - name: Split Remotion composition and runner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("n8n-render-cloud/src/render.tsx")
          s=p.read_text()
          start=s.index("const jobPath")
          composition=s[:start] + "\nregisterRoot(Root);\n"
          Path("n8n-render-cloud/src/composition.tsx").write_text(composition)
          runner="""import {renderMedia, selectComposition} from '@remotion/renderer';
          import {bundle} from '@remotion/bundler';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import type {RenderJob} from './composition';
          const jobPath = process.env.RENDER_JOB || 'render-job.json';
          const fps=30;
          async function main(){
            const job: RenderJob = JSON.parse(await fs.readFile(jobPath,'utf8'));
            const outDir=path.resolve('output');
            await fs.mkdir(outDir,{recursive:true});
            const output=path.join(outDir,job.output_name || `render-${Date.now()}.mp4`);
            const serveUrl=await bundle({entryPoint:path.resolve('src/composition.tsx'),webpackOverride:(c:any)=>c});
            const comp=await selectComposition({serveUrl,id:'YTVideo',inputProps:{job}});
            await renderMedia({codec:'h264',serveUrl,composition:comp,inputProps:{job},outputLocation:output,overwrite:true});
            await fs.writeFile(path.join(outDir,'result.json'),JSON.stringify({status:'rendered',video_file:output,aspect_ratio:job.aspect_ratio||'16:9',duration:comp.durationInFrames/fps},null,2));
            console.log(JSON.stringify({status:'rendered',video_file:output,duration:comp.durationInFrames/fps}));
          }
          main().catch(err=>{console.error(err);process.exit(1);});
          """
          p.write_text(runner)
          PY
      - name: Install worker dependencies
        run: cd n8n-render-cloud && npm install
      - name: Ensure Remotion browser
        run: cd n8n-render-cloud && npx remotion browser ensure
      - name: Render
        id: render
        continue-on-error: true
        run: |
          cd n8n-render-cloud
          npm run render > ../render-failure.log 2>&1
          rc=$?
          cat ../render-failure.log
          echo "Render exit code: $rc"
          exit $rc
      - name: Publish failure log
        if: steps.render.outcome == 'failure'
        run: |
          cp render-failure.log "failed-render-${{ inputs.job_id }}.log"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "failed-render-${{ inputs.job_id }}.log"
          git commit -m "Render failure log ${{ inputs.job_id }}" || true
          git push
      - name: Publish public render asset
        if: steps.render.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset=$(basename n8n-render-cloud/output/*.mp4)
          tag="render-${{ github.run_id }}"
          gh release create "$tag" "n8n-render-cloud/output/$asset" --title "YouTube Render ${{ github.run_id }}" --notes "Automated render handoff for job ${{ inputs.job_id }}" --target "${{ github.sha }}"
      - name: Upload render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-render-${{ github.run_id }}
          path: n8n-render-cloud/output/
          if-no-files-found: error
          retention-days: 1
