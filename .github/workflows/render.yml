name: Render YouTube Video
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Render job ID; file must exist at jobs/<job_id>.json'
        required: true
        type: string
permissions:
        ops: write
contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load render job
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: tar -xzf n8n-render-cloud-worker.tar.gz && cp "jobs/${JOB_ID}.json" n8n-render-cloud/render-job.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        run: cd n8n-render-cloud && npm install
      - name: Ensure Remotion browser
        run: cd n8n-render-cloud && npx remotion browser ensure
      - name: Render
        id:render
        run: |
          set +e
          cd n8n-render-cloud
          npm run render > ../render-failure.log 2>&1
          rc=$?
          cat ../render-failure.log
          echo "Render exit code: $rc"
          exit $rc
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name "github-action"
          git config user.email "github-action@users.noreply.github.com"
          cp render-failure.log "failed-render-${{ inputs.job_id }}.log"
          git add "failed-render-${{ inputs.job_id }}.log"
          git commit -m "Render failure log ${{ inputs.job_id }}"
          git push
      - name: Publish public render asset
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="youtube-${{ github.run_id }}.mp4"
          cp n8n-render-cloud/output/*.mp4 "n8n-render-cloud/output/$asset"
          tag="render-${{ github.run_id }}"
          gh release create "$tag" "n8n-render-cloud/output/$asset" --title "YouTube Render ${{ github.run_id }}" --notes "Automated render handoff for job ${{ inputs.job_id }}" --target "${{ github.sha }}"
      - name: Upload render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-render-${{ github.run_id }}
          path: n8n-render-cloud/output/
          retention-days: 1
